# ── mode_settings.yaml ───────────────────────────────────────────────────────
# Settings mode — contrast, WiFi SSID/IP info, sleep timeout, battery interval.
# Display + interaction logic lives in src/settings_controller.h.
#
# Button entry points (called via buttons.yaml / layout files):
#   settings_btn_up    → previous setting row  (↑ / pin22)
#   settings_btn_down  → next setting row      (↓ / pin33)
#   settings_btn_left  → decrease value        (← / pin14)
#   settings_btn_right → increase value        (→ / pin26)
# Main update loop: settings_update
#
# Battery: the PCB package (packages/boards/) reads it - an ADC divider or a
# fuel gauge - into battery_mv / battery_pct and runs battery_updated below.
#
# Note: on_value gates settings_draw on !id(is_timer_wake), which is expected
# to be defined in the main remote.yaml.

esphome:
  includes:
    - src/settings_controller.h

# Settings > HISTORY fetches the battery's past values from Home Assistant's
# REST API (the native API has no history call) - see history_request_if_due.
http_request:
  id: http_client
  timeout: 5s
  verify_ssl: false       # plain http://, or https:// with a self-signed cert

# ── WiFi info sensors ─────────────────────────────────────────────────────────
text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid_sensor
      name: "WiFi SSID"
      internal: true
      on_value:
        then: [ script.execute: settings_draw ]
    ip_address:
      id: wifi_ip_sensor
      name: "WiFi IP"
      internal: true
      on_value:
        then: [ script.execute: settings_draw ]

# ── Battery sensors ───────────────────────────────────────────────────────────
# Two HA-facing entities under this device: voltage (device_class: voltage)
# and percentage (device_class: battery). Both are templates without a
# lambda: battery_updated publishes them after every battery_source reading.
sensor:
  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    internal: false
    device_class: voltage
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic

  - platform: template
    id: battery_percentage_sensor
    name: "Battery"
    internal: false
    device_class: battery
    unit_of_measurement: "%"
    state_class: measurement
    entity_category: diagnostic

# ── globals ───────────────────────────────────────────────────────────────────
globals:
  - id: selected_setting_index
    type: int
    initial_value: '0'
    restore_value: true

  - id: contrast_level      # 1–10 (maps to 0.1–1.0)
    type: int
    initial_value: '5'      # matches contrast: 0.5 in display config
    restore_value: true

  - id: battery_pct         # 0–100, or -1 when not yet read
    type: int
    initial_value: '-1'

  - id: battery_mv          # battery voltage in mV (0 = not yet read)
    type: int
    initial_value: '0'

  - id: sleep_timeout_mins  # idle time before sleeping (1–60 min)
    type: int
    initial_value: '${SLEEP_TIMEOUT_MIN}'
    restore_value: true

  - id: battery_interval_mins  # timer-wake interval for battery check (15 min to 14 days)
    type: int
    initial_value: '${BATTERY_INTERVAL_MIN}'
    restore_value: true

  - id: battery_history_range  # Settings > HISTORY: 0 = 24H, 1 = 7D, 2 = 30D
    type: int
    initial_value: '0'
    restore_value: true

  # ── Light Sleep only (USE_LIGHT_SLEEP) — inert on a Deep Sleep build ────────

  - id: deep_sleep_fallback_mins  # total idle minutes before a real deep sleep (0=off, 5-1440)
    type: int
    initial_value: '${DEEP_SLEEP_FALLBACK_MIN}'
    restore_value: true

  - id: quiet_hours_start   # 0–23; equal to quiet_hours_end disables the schedule
    type: int
    initial_value: '${QUIET_HOURS_START}'
    restore_value: true

  - id: quiet_hours_end     # 0–23; deep-sleeps right after the SLEEP_TIMEOUT_MIN
    type: int               # blank (instead of waiting for deep_sleep_fallback_mins)
    initial_value: '${QUIET_HOURS_END}'  # whenever the current hour is in [start, end).
    restore_value: true

# ── scripts ───────────────────────────────────────────────────────────────────
script:

  - id: settings_btn_up
    then:
      - lambda: >-
          SettingsController::prevSetting(id(selected_setting_index),
            ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE});
          id(updated_ui) = true;
      - script.execute: settings_draw

  - id: settings_btn_down
    then:
      - lambda: >-
          SettingsController::nextSetting(id(selected_setting_index),
            ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE});
          id(updated_ui) = true;
      - script.execute: settings_draw

  - id: settings_btn_left
    then:
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_CONTRAST;' }
          then:
            - lambda: 'SettingsController::contrastDown(id(contrast_level), id(updated_ui));'
            - script.execute: settings_apply_contrast
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_SLEEP;' }
          then:
            - lambda: 'SettingsController::sleepDown(id(sleep_timeout_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_BATT_INTERVAL;' }
          then:
            - lambda: 'SettingsController::battIntervalDown(id(battery_interval_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_DEEP_AFTER;' }
          then:
            - lambda: 'SettingsController::deepAfterDown(id(deep_sleep_fallback_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_FROM;' }
          then:
            - lambda: 'SettingsController::hourDown(id(quiet_hours_start), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_TO;' }
          then:
            - lambda: 'SettingsController::hourDown(id(quiet_hours_end), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_HISTORY;' }
          then:
            - lambda: 'SettingsController::historyRangeDown(id(battery_history_range), id(updated_ui));'
      # restore_value globals only queue their NVS write - ESPHome's default
      # preferences component batches the actual flash commit every 60s, so
      # a value changed here would silently revert to its old default if
      # the remote lost power (unplugged, battery pulled) inside that
      # window, even though it "worked" as long as the device stayed
      # powered afterward (e.g. Light Sleep). Force it through immediately -
      # these are deliberate, infrequent button presses, not a hot loop, so
      # the extra flash write is cheap.
      - lambda: 'global_preferences->sync();'
      - script.execute: settings_draw

  - id: settings_btn_right
    then:
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_CONTRAST;' }
          then:
            - lambda: 'SettingsController::contrastUp(id(contrast_level), id(updated_ui));'
            - script.execute: settings_apply_contrast
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_SLEEP;' }
          then:
            - lambda: 'SettingsController::sleepUp(id(sleep_timeout_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_BATT_INTERVAL;' }
          then:
            - lambda: 'SettingsController::battIntervalUp(id(battery_interval_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_DEEP_AFTER;' }
          then:
            - lambda: 'SettingsController::deepAfterUp(id(deep_sleep_fallback_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_FROM;' }
          then:
            - lambda: 'SettingsController::hourUp(id(quiet_hours_start), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_TO;' }
          then:
            - lambda: 'SettingsController::hourUp(id(quiet_hours_end), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_HISTORY;' }
          then:
            - lambda: 'SettingsController::historyRangeUp(id(battery_history_range), id(updated_ui));'
      # See the matching comment in settings_btn_left - forces the NVS write
      # through now instead of leaving it queued for the periodic 60s flush.
      - lambda: 'global_preferences->sync();'
      - script.execute: settings_draw

  # Settings > HISTORY asked for a range (BatteryHistory::open): fetch it from
  # Home Assistant's history REST API right here (hist::fetch_ha, blocking
  # for well under a second on a LAN; the LOADING frame is already on screen).
  # ${HA_URL} / ${HA_TOKEN} come from secrets.yaml via remote.yaml's
  # substitutions.
  - id: history_request_if_due
    then:
      - lambda: |-
          #if BATTERY_HISTORY_FEATURE
          int range; uint8_t req_id, count; uint16_t bucket_min;
          if (!BatteryHistory::takeSendRequest(range, req_id, bucket_min, count)) return;
          const bool have_time = id(sntp_time)->now().is_valid();
          hist::FetchResult res;
          hist::fetch_ha(id(http_client), "${HA_URL}", "${HA_TOKEN}", "${BATTERY_HISTORY_ENTITY}",
                         have_time ? (uint32_t) id(sntp_time)->timestamp_now() : 0, ESPTime::timezone_offset(),
                         bucket_min, count, res, "history");
          BatteryHistory::setResult(range, res.status, bucket_min, count, res.end_ts, res.tz_s,
                                    res.data.values(), res.data.valid());
          id(updated_ui) = true;
          #endif
      - script.execute: settings_draw

  - id: settings_apply_contrast
    then:
      - lambda: 'id(oled_display)->set_contrast(SettingsController::contrastFloat(id(contrast_level)));'

  # Called by the PCB package after each battery reading (battery_mv and
  # battery_pct already set).
  - id: battery_updated
    then:
      - lambda: |-
          id(battery_voltage).publish_state(id(battery_mv) / 1000.0f);
          id(battery_percentage_sensor).publish_state(id(battery_pct));
          ContextStrip::setBattery(id(battery_pct));
          id(updated_ui) = true;
      - if:
          condition: { lambda: 'return !id(is_timer_wake);' }
          then: [ script.execute: settings_draw ]

  - id: settings_update
    then:
      - lambda: >-
          SettingsController::sanitize(id(selected_setting_index),
            ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE});
      - script.execute: settings_draw

  - id: settings_draw
    then:
      - if:
          condition:
            lambda: 'return id(app_mode) == APP_SETTINGS && !id(menu_active) && !id(is_booting) && id(conn_status) == 0;'
          then:
            - lambda: >-
                SettingsController::draw(id(oled_display), id(font_base), id(font_small),
                  id(selected_setting_index), id(contrast_level),
                  id(wifi_ssid_sensor).state, id(wifi_ip_sensor).state,
                  id(battery_pct), id(battery_mv),
                  id(sleep_timeout_mins), id(battery_interval_mins),
                  id(deep_sleep_fallback_mins), id(quiet_hours_start), id(quiet_hours_end),
                  ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE},
                  id(updated_ui), id(conn_status), id(battery_history_range));

# ── Settings SYSTEM / ABOUT / HISTORY tick ────────────────────────────────────
# Every 50 ms while the ABOUT intro plays, a SYSTEM sample is due or HISTORY
# waits for its data (SettingsController::needsTick); otherwise does nothing.
# Redraws when the page says so (tick) and sends the history request the page
# asked for. Stops for good once shutdown begins, and while a Light Sleep
# build has the screen blanked.
interval:
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: >-
              return id(app_mode) == APP_SETTINGS && !id(menu_active) && !id(is_booting)
                && !id(is_timer_wake) && !id(is_shutting_down) && !id(is_light_sleeping)
                && id(conn_status) == 0
                && SettingsController::needsTick(id(selected_setting_index));
          then:
            - lambda: 'SystemStats::setLink(wifi::global_wifi_component->wifi_rssi());'
            - if:
                condition: { lambda: 'return SettingsController::tick(id(selected_setting_index));' }
                then:
                  - lambda: 'id(updated_ui) = true;'
                  - script.execute: settings_draw
            - script.execute: history_request_if_due
