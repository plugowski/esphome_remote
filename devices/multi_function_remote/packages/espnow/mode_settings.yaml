# ── espnow/mode_settings.yaml ────────────────────────────────────────────────
# Settings mode for the ESP-NOW remote — contrast, sleep timeout, battery
# interval, link info.  Display logic lives in src/settings_controller.h.
#
# The two network rows of the shared settings screen are reused:
#   WIFI row → "ESPNOW CH <n>"       (channel the hub answered on)
#   IP row   → hub MAC, or "NO HUB"
#
# Battery sensor: raw ADC on GPIO34 through a 1:2 voltage divider.
# battery_pct / battery_mv are also what hub_send_battery reports on timer wake.

esphome:
  includes:
    - src/settings_controller.h

sensor:
  - platform: adc
    pin: GPIO34
    id: battery_raw
    internal: true
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
    on_value:
      then:
        - lambda: |-
            id(battery_mv) = static_cast<int>(x * 1000.0f);
            float pct = (x - 3.2f) / 1.0f * 100.0f;
            id(battery_pct) = static_cast<int>((pct < 0.0f) ? 0.0f : (pct > 100.0f) ? 100.0f : pct);
            ContextStrip::setBattery(id(battery_pct));
            id(updated_ui) = true;
        - if:
            condition: { lambda: 'return !id(is_timer_wake);' }
            then: [ script.execute: settings_draw ]
        # Report every changed reading to the hub (and so to Home Assistant), whatever triggered it:
        # the wake-up read, the 60 s poll or the Settings screen. A timer wake sends its own report.
        - if:
            condition: { lambda: 'return !id(is_timer_wake) && id(battery_pct) != id(battery_pct_sent);' }
            then:
              - lambda: 'id(battery_pct_sent) = id(battery_pct);'
              - script.execute: hub_send_battery

globals:
  - id: selected_setting_index
    type: int
    initial_value: '0'
    restore_value: true

  - id: contrast_level      # 1–10 (maps to 0.1–1.0)
    type: int
    initial_value: '5'
    restore_value: true

  - id: battery_pct         # 0–100, or -1 when not yet read
    type: int
    initial_value: '-1'

  - id: battery_mv          # battery voltage in mV (0 = not yet read)
    type: int
    initial_value: '0'

  - id: battery_pct_sent    # last percentage reported to the hub (-1 = nothing sent since boot)
    type: int
    initial_value: '-1'

  - id: sleep_timeout_mins  # idle time before sleeping (1–30 min)
    type: int
    initial_value: '${SLEEP_TIMEOUT_MIN}'
    restore_value: true

  - id: battery_interval_mins  # timer-wake interval for battery check (15 min to 14 days)
    type: int
    initial_value: '${BATTERY_INTERVAL_MIN}'
    restore_value: true

  # ── Light Sleep only (USE_LIGHT_SLEEP) — inert on a Deep Sleep build ────────

  - id: deep_sleep_fallback_mins  # total idle minutes before a real deep sleep (0=off, 5-1440)
    type: int
    initial_value: '${DEEP_SLEEP_FALLBACK_MIN}'
    restore_value: true

  - id: quiet_hours_start   # 0–23; equal to quiet_hours_end disables the schedule
    type: int
    initial_value: '${QUIET_HOURS_START}'
    restore_value: true

  - id: quiet_hours_end     # 0–23; deep-sleeps right after the SLEEP_TIMEOUT_MIN
    type: int               # blank (instead of waiting for deep_sleep_fallback_mins)
    initial_value: '${QUIET_HOURS_END}'  # whenever the current hour is in [start, end).
    restore_value: true

script:

  - id: settings_btn_up
    then:
      - lambda: >-
          SettingsController::prevSetting(id(selected_setting_index),
            ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE});
          id(updated_ui) = true;
      - script.execute: settings_draw

  - id: settings_btn_down
    then:
      - lambda: >-
          SettingsController::nextSetting(id(selected_setting_index),
            ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE});
          id(updated_ui) = true;
      - script.execute: settings_draw

  - id: settings_btn_left
    then:
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_CONTRAST;' }
          then:
            - lambda: 'SettingsController::contrastDown(id(contrast_level), id(updated_ui));'
            - script.execute: settings_apply_contrast
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_SLEEP;' }
          then:
            - lambda: 'SettingsController::sleepDown(id(sleep_timeout_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_BATT_INTERVAL;' }
          then:
            - lambda: 'SettingsController::battIntervalDown(id(battery_interval_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_DEEP_AFTER;' }
          then:
            - lambda: 'SettingsController::deepAfterDown(id(deep_sleep_fallback_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_FROM;' }
          then:
            - lambda: 'SettingsController::hourDown(id(quiet_hours_start), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_TO;' }
          then:
            - lambda: 'SettingsController::hourDown(id(quiet_hours_end), id(updated_ui));'
      # restore_value globals only queue their NVS write - ESPHome's default
      # preferences component batches the actual flash commit every 60s, so
      # a value changed here would silently revert to its old default if
      # the remote lost power (unplugged, battery pulled) inside that
      # window, even though it "worked" as long as the device stayed
      # powered afterward (e.g. Light Sleep). Force it through immediately -
      # these are deliberate, infrequent button presses, not a hot loop, so
      # the extra flash write is cheap.
      - lambda: 'global_preferences->sync();'
      - script.execute: settings_draw

  - id: settings_btn_right
    then:
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_CONTRAST;' }
          then:
            - lambda: 'SettingsController::contrastUp(id(contrast_level), id(updated_ui));'
            - script.execute: settings_apply_contrast
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_SLEEP;' }
          then:
            - lambda: 'SettingsController::sleepUp(id(sleep_timeout_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_BATT_INTERVAL;' }
          then:
            - lambda: 'SettingsController::battIntervalUp(id(battery_interval_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_DEEP_AFTER;' }
          then:
            - lambda: 'SettingsController::deepAfterUp(id(deep_sleep_fallback_mins), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_FROM;' }
          then:
            - lambda: 'SettingsController::hourUp(id(quiet_hours_start), id(updated_ui));'
      - if:
          condition: { lambda: 'return id(selected_setting_index) == SETTING_QUIET_TO;' }
          then:
            - lambda: 'SettingsController::hourUp(id(quiet_hours_end), id(updated_ui));'
      # See the matching comment in settings_btn_left - forces the NVS write
      # through now instead of leaving it queued for the periodic 60s flush.
      - lambda: 'global_preferences->sync();'
      - script.execute: settings_draw

  - id: settings_apply_contrast
    then:
      - lambda: 'id(oled_display)->set_contrast(SettingsController::contrastFloat(id(contrast_level)));'

  - id: settings_update
    then:
      - lambda: >-
          SettingsController::sanitize(id(selected_setting_index),
            ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE});
      - script.execute: settings_draw

  - id: settings_draw
    then:
      - if:
          condition:
            lambda: 'return id(app_mode) == APP_SETTINGS && !id(menu_active) && !id(is_booting);'
          then:
            - lambda: |-
                std::string link = "ESPNOW CH " + std::to_string(id(espnow_channel));
                std::string hub  = id(hub_known) ? "HUB " + EspNowRemote::macToString(id(hub_mac).data()).substr(9)
                                                 : std::string("NO HUB");
                SettingsController::draw(id(oled_display), id(font_small),
                  id(selected_setting_index), id(contrast_level),
                  link, hub,
                  id(battery_pct), id(sleep_timeout_mins), id(battery_interval_mins),
                  id(deep_sleep_fallback_mins), id(quiet_hours_start), id(quiet_hours_end),
                  ${BATTERY_ENABLED}, ${USE_LIGHT_SLEEP}, ${QUIET_HOURS_ON_DEVICE},
                  id(updated_ui), id(conn_status));
