# ── espnow/mode_automations.yaml ─────────────────────────────────────────────
# Automations mode over ESP-NOW.  The shared menu.yaml quick-action flow and
# this package both end in auto_call_ha, which here resolves the (entity,
# service) pair back to an index in AUTOMATION_LIST / QUICK_ACTION_LIST and
# sends one rnp::CMD packet.  The hub owns the same lists and performs the
# actual Home Assistant service call.
#
# Button entry points (via buttons.yaml / layout):
#   automations_btn_prev / _next     → scroll
#   automations_btn_trigger          → trigger selected row
#   automations_btn_menu_l / _menu_r → run the L / R shortcut key
# Main update loop: automations_update

esphome:
  includes:
    - src/automation_entities.h     # must come before automation_controller.h
    - src/automation_controller.h

globals:
  - id: selected_auto_index
    type: int
    initial_value: '0'
    restore_value: true

  # true → one automation per screen (card); false → 4-row list. Set from the
  # AUTOMATIONS_CARD_VIEW substitution.
  - id: automations_card_view
    type: bool
    initial_value: '${AUTOMATIONS_CARD_VIEW}'

  - id: auto_entity
    type: std::string
    initial_value: '""'

  - id: auto_service
    type: std::string
    initial_value: '""'

script:

  - id: automations_btn_prev
    then:
      - lambda: 'AutomationController::prevAuto(id(selected_auto_index)); id(updated_ui) = true;'
      - script.execute: automations_draw

  - id: automations_btn_next
    then:
      - lambda: 'AutomationController::nextAuto(id(selected_auto_index)); id(updated_ui) = true;'
      - script.execute: automations_draw

  - id: automations_btn_trigger
    then:
      - lambda: >-
          AutomationController::triggerSelected(id(selected_auto_index),
                                                id(auto_entity), id(auto_service));
      - script.execute: auto_do_trigger

  - id: automations_btn_menu_l
    then:
      - lambda: >-
          AutomationController::triggerShortcut(AUTOMATION_SHORTCUT_L, id(auto_entity), id(auto_service));
      - script.execute: auto_do_trigger

  - id: automations_btn_menu_r
    then:
      - lambda: >-
          AutomationController::triggerShortcut(AUTOMATION_SHORTCUT_R, id(auto_entity), id(auto_service));
      - script.execute: auto_do_trigger

  # Runs whatever the trigger script loaded and confirms it with the SENT
  # toast over the screen (2 s, any key closes it).
  - id: auto_do_trigger
    mode: single
    then:
      - if:
          condition: { lambda: 'return !id(auto_entity).empty();' }
          then:
            - script.execute: auto_call_ha
            - lambda: |-
                Toast::show("SENT", nullptr, 2000, Toast::ICON_CHECK_INLINE, 112, 30);
                id(updated_ui) = true;
            - script.execute: automations_draw

  # Same id as in packages/mode_automations.yaml so menu.yaml keeps working.
  - id: auto_call_ha
    mode: queued
    then:
      - lambda: |-
          uint8_t domain = 0, idx = 0;
          if (!EspNowRemote::resolveAction(id(auto_entity), id(auto_service), domain, idx)) {
            ESP_LOGW("hub", "No automation/quick action for %s (%s)",
                     id(auto_entity).c_str(), id(auto_service).c_str());
            return;
          }
          id(espnow_cmd).execute(domain, idx, rnp::AUTO_TRIGGER, 0);

  # ── display ───────────────────────────────────────────────────────────────

  - id: automations_update
    then:
      - lambda: |-
          if (id(selected_auto_index) >= AUTOMATION_LIST_COUNT) id(selected_auto_index) = 0;
          id(selected_auto_index) = RoomFilter::first(id(selected_auto_index), AUTOMATION_LIST_COUNT, automationRoom);
      - script.execute: automations_draw

  - id: automations_draw
    then:
      - if:
          condition:
            lambda: 'return id(app_mode) == APP_AUTOMATIONS && !id(menu_active) && !id(is_booting) && id(conn_status) == 0;'
          then:
            - lambda: >-
                id(updated_ui) = true;
                AutomationController::draw(id(oled_display), id(font_base), id(font_small),
                                           id(automation_icon), id(shortcut_icon),
                                           id(selected_auto_index), id(automations_card_view),
                                           id(updated_ui), id(conn_status));
