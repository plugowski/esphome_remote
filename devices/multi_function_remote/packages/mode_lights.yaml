# ── mode_lights.yaml ─────────────────────────────────────────────────────────
# Lights mode — two views selected at build time by ${LIGHTS_CARD_VIEW}:
#   card view (default): one light per screen with LOW/FULL presets
#   list view:           scrollable list with on/off toggle and ±5 % steps
# Entity configuration lives in src/light_entities.h.
# Display + interaction logic lives in src/lights_controller.h (button
# mapping table for both views is documented there).
#
# Button entry points (called from buttons.yaml / layout_v2.yaml):
#   lights_btn_circle_l / lights_btn_circle_r   → pin22 / pin33
#   lights_btn_left / lights_btn_right          → ← / →
#   lights_btn_ok / lights_btn_stop             → ● / ■
#   lights_btn_up / lights_btn_down             → ↑ / ↓
# These dispatch to the primitive actions below depending on the view:
#   lights_btn_prev / _next / _toggle / _on / _off / _preset_low / _preset_full
#   lights_btn_brightness_up / _down
# Main update loop: lights_update

esphome:
  includes:
    - src/light_entities.h      # must come before lights_controller.h
    - src/lights_controller.h

# ── card-view icons ───────────────────────────────────────────────────────────
# The ON bulb is the same Material "lightbulb" glyph with the FILL axis set to
# 1. Google Fonts cannot serve that axis through ESPHome's gfonts loader, so a
# 2 KB static subset (just this glyph) ships in fonts/ instead.
font:
  - file: "fonts/material_symbols_rounded_fill.ttf"
    id: lights_icon_on
    size: 26
    glyphs:
      - "\ue0f0"  # lightbulb, filled (card view, light ON)
  - file:
      type: gfonts
      family: Material+Symbols+Rounded
      weight: 400
    id: lights_icon_off
    size: 26
    glyphs:
      - "\ue0f0"  # lightbulb — plain bulb (card view, light OFF)

# ── globals ───────────────────────────────────────────────────────────────────
globals:
  - id: selected_light_index
    type: int
    initial_value: '0'
    restore_value: true

  # true  → card view (one light per screen, LOW/FULL presets on the circles)
  # false → original scrollable list.  Set from the LIGHTS_CARD_VIEW
  # substitution in remote*.yaml (the generator's "Lights view" selector).
  - id: lights_card_view
    type: bool
    initial_value: '${LIGHTS_CARD_VIEW}'

# ── HA sensors ────────────────────────────────────────────────────────────────
# One text_sensor per light for on/off state.
# One sensor per dimmable light for brightness (HA sends 0-255; converted to 0-100 %).

text_sensor:
  - platform: homeassistant
    id: desk_monitor_light
    entity_id: light.desk_monitor_light
    on_value:
      then:
        - lambda: 'LightsController::syncLight("light.desk_monitor_light", x, NAN, id(updated_ui));'
        - script.execute: lights_draw

  - platform: homeassistant
    id: office_main_light
    entity_id: light.office_main
    on_value:
      then:
        - lambda: 'LightsController::syncLight("light.office_main", x, NAN, id(updated_ui));'
        - script.execute: lights_draw

  - platform: homeassistant
    id: skadis_strip_light
    entity_id: light.skadis_strip_light
    on_value:
      then:
        - lambda: 'LightsController::syncLight("light.skadis_strip_light", x, NAN, id(updated_ui));'
        - script.execute: lights_draw

sensor:
  - platform: homeassistant
    id: skadis_strip_brightness
    entity_id: light.skadis_strip_light
    attribute: brightness
    on_value:
      then:
        - lambda: 'LightsController::syncLight("light.skadis_strip_light", id(skadis_strip_light).state, x * 100.0f / 255.0f, id(updated_ui));'
        - script.execute: lights_draw

# ── scripts ───────────────────────────────────────────────────────────────────
script:

  - id: lights_btn_prev
    then:
      - lambda: 'LightsController::prevLight(id(selected_light_index)); id(updated_ui) = true;'
      - script.execute: lights_draw

  - id: lights_btn_next
    then:
      - lambda: 'LightsController::nextLight(id(selected_light_index)); id(updated_ui) = true;'
      - script.execute: lights_draw

  - id: lights_btn_toggle
    then:
      - lambda: 'LightsController::toggleLight(id(selected_light_index), id(updated_ui));'
      - script.execute: lights_do_toggle
      - script.execute: lights_draw

  - id: lights_btn_brightness_up
    then:
      - lambda: 'LightsController::brightnessUp(id(selected_light_index), id(updated_ui));'
      # Only a dimmable light that is ON has anything to send - the controller
      # ignores the step otherwise, and a brightness command would switch a
      # non-dimmable light on behind the screen's back.
      - if:
          condition: { lambda: 'return LightsController::isDimmable(id(selected_light_index)) && LightsController::isOn(id(selected_light_index));' }
          then: [ script.execute: lights_do_brightness ]
      - script.execute: lights_draw

  - id: lights_btn_brightness_down
    then:
      - lambda: 'LightsController::brightnessDown(id(selected_light_index), id(updated_ui));'
      # Only a dimmable light that is ON has anything to send - the controller
      # ignores the step otherwise, and a brightness command would switch a
      # non-dimmable light on behind the screen's back.
      - if:
          condition: { lambda: 'return LightsController::isDimmable(id(selected_light_index)) && LightsController::isOn(id(selected_light_index));' }
          then: [ script.execute: lights_do_brightness ]
      - script.execute: lights_draw


  # ── view-aware dispatchers ────────────────────────────────────────────────
  # buttons.yaml and the layouts call these; which action a button performs
  # depends on the active view (lights_card_view). See the mapping table at
  # the top of src/lights_controller.h.

  - id: lights_btn_circle_l         # pin22 — list: prev | card: LOW / ON
    then:
      - if:
          condition: { lambda: 'return id(lights_card_view);' }
          then:
            - if:
                condition: { lambda: 'return LightsController::isDimmable(id(selected_light_index));' }
                then: [ script.execute: lights_btn_preset_low ]
                else: [ script.execute: lights_btn_preset_full ]   # no dimmer: ON
          else: [ script.execute: lights_btn_prev ]

  - id: lights_btn_circle_r         # pin33 — list: next | card: FULL / OFF
    then:
      - if:
          condition: { lambda: 'return id(lights_card_view);' }
          then:
            - if:
                condition: { lambda: 'return LightsController::isDimmable(id(selected_light_index));' }
                then: [ script.execute: lights_btn_preset_full ]
                else: [ script.execute: lights_btn_preset_low ]    # no dimmer: OFF
          else: [ script.execute: lights_btn_next ]

  - id: lights_btn_left             # ← — list: brightness − | card: prev
    then:
      - if:
          condition: { lambda: 'return id(lights_card_view);' }
          then: [ script.execute: lights_btn_prev ]
          else: [ script.execute: lights_btn_brightness_down ]

  - id: lights_btn_right            # → — list: brightness + | card: next
    then:
      - if:
          condition: { lambda: 'return id(lights_card_view);' }
          then: [ script.execute: lights_btn_next ]
          else: [ script.execute: lights_btn_brightness_up ]

  - id: lights_btn_ok               # ● — toggle on/off (both views)
    then: [ script.execute: lights_btn_toggle ]

  - id: lights_btn_up               # ↑ — list: prev | card: brightness +
    then:
      - if:
          condition: { lambda: 'return id(lights_card_view);' }
          then: [ script.execute: lights_btn_brightness_up ]
          else: [ script.execute: lights_btn_prev ]

  - id: lights_btn_down             # ↓ — list: next | card: brightness −
    then:
      - if:
          condition: { lambda: 'return id(lights_card_view);' }
          then: [ script.execute: lights_btn_brightness_down ]
          else: [ script.execute: lights_btn_next ]

  - id: lights_btn_stop             # ■ — OFF (both views)
    then: [ script.execute: lights_btn_off ]

  # ── on / off ──────────────────────────────────────────────────────────────

  - id: lights_btn_on
    then:
      - lambda: 'LightsController::turnOn(id(selected_light_index), id(updated_ui));'
      - script.execute: lights_do_on
      - script.execute: lights_draw

  - id: lights_btn_off
    then:
      - lambda: 'LightsController::turnOff(id(selected_light_index), id(updated_ui));'
      - script.execute: lights_do_off
      - script.execute: lights_draw

  # Presets: a dimmable light gets turn_on + brightness; a non-dimmable one
  # just goes OFF (low) / ON (full).
  - id: lights_btn_preset_low
    then:
      - lambda: 'LightsController::setPreset(id(selected_light_index), LightsController::PRESET_LOW, id(updated_ui));'
      - script.execute: lights_send_preset
      - script.execute: lights_draw

  - id: lights_btn_preset_full
    then:
      - lambda: 'LightsController::setPreset(id(selected_light_index), LightsController::PRESET_FULL, id(updated_ui));'
      - script.execute: lights_send_preset
      - script.execute: lights_draw

  - id: lights_send_preset
    then:
      - if:
          condition: { lambda: 'return LightsController::isDimmable(id(selected_light_index));' }
          then: [ script.execute: lights_do_brightness ]
          else:
            - if:
                condition: { lambda: 'return LightsController::isOn(id(selected_light_index));' }
                then: [ script.execute: lights_do_on ]
                else: [ script.execute: lights_do_off ]

  # ── HA service calls ──────────────────────────────────────────────────────

  - id: lights_do_toggle
    mode: queued
    then:
      # Button presses taken before the API is connected land here immediately
      # (the screen and globals already updated synchronously) — wait rather
      # than silently drop the command; give up after a generous timeout.
      - wait_until: { condition: { api.connected: }, timeout: 10s }
      - if:
          condition: { api.connected: }
          then:
            - homeassistant.action:
                action: light.toggle
                data:
                  entity_id: !lambda 'return LIGHTS_LIST[id(selected_light_index)].entity_id;'

  - id: lights_do_brightness
    mode: restart
    then:
      - delay: 300ms    # debounce — coalesce rapid presses before sending
      - wait_until: { condition: { api.connected: }, timeout: 10s }
      - if:
          condition: { api.connected: }
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return LIGHTS_LIST[id(selected_light_index)].entity_id;'
                  brightness_pct: !lambda 'return LightsController::getBrightness(id(selected_light_index));'

  - id: lights_do_on
    mode: queued
    then:
      - wait_until: { condition: { api.connected: }, timeout: 10s }
      - if:
          condition: { api.connected: }
          then:
            - homeassistant.action:
                action: light.turn_on
                data:
                  entity_id: !lambda 'return LIGHTS_LIST[id(selected_light_index)].entity_id;'

  - id: lights_do_off
    mode: queued
    then:
      - wait_until: { condition: { api.connected: }, timeout: 10s }
      - if:
          condition: { api.connected: }
          then:
            - homeassistant.action:
                action: light.turn_off
                data:
                  entity_id: !lambda 'return LIGHTS_LIST[id(selected_light_index)].entity_id;'

  # ── display ───────────────────────────────────────────────────────────────

  - id: lights_update
    then:
      - lambda: 'if (id(selected_light_index) >= LIGHTS_LIST_COUNT) id(selected_light_index) = 0;'
      - script.execute: lights_draw

  - id: lights_draw
    then:
      - if:
          condition:
            lambda: 'return id(app_mode) == APP_LIGHTS && !id(menu_active) && !id(is_booting) && id(conn_status) == 0;'
          then:
            - if:
                condition: { lambda: 'return id(lights_card_view);' }
                then:
                  - lambda: >-
                      LightsController::drawCard(id(oled_display), id(font_base), id(font_small),
                                                 id(lights_icon_on), id(lights_icon_off),
                                                 id(selected_light_index), id(updated_ui), id(conn_status));
                else:
                  - lambda: >-
                      LightsController::draw(id(oled_display), id(font_small),
                                             id(selected_light_index), id(updated_ui), id(conn_status));
