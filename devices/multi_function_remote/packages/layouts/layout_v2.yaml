# ── layout_v2.yaml ────────────────────────────────────────────────────────────
# Physical button layout for v2 hardware — 6-button directional pad.
#
# Keys are named after their PCB switch; the GPIO behind each name comes from
# the PCB package (packages/boards/pcb_*.yaml).
#
# Key assignment:
#   MODE      ←  left arrow
#   FAN       →  right arrow
#   UP_1      ●  primary: toggle / run / confirm  → btn_ok
#   UP_2      ↑  up arrow
#   DOWN_2    ↓  down arrow
#   DOWN_1    ■  off / stop / cancel
#                  short press  (50 – 700 ms) → btn_stop
#                  long  press  (800 – 3000 ms) → btn_menu_open
#   POWER     power off  (shared with deep-sleep wake pin — allow_other_uses: true)
#
# Always-present hardware buttons (shared with v1):
#   ECO       ☰  menu           short: open / confirm menu | long (0.8 s): room picker
#   SELECT    MODE / <<         menu prev | AC: HVAC mode | Lights: prev or LOW/ON | Covers: open | Autos: L slot
#   AC_POWER  FAN  / >>         menu next | AC: fan speed | Lights: next or FULL/OFF | Covers: close | Autos: R slot
#
# btn_* routing logic lives in packages/buttons.yaml.
# ECO / SELECT / AC_POWER are dispatched inline (different semantics from btn_left/right).

binary_sensor:

  # ── power off ──────────────────────────────────────────────────────────────
  - platform: gpio
    pin:
      allow_other_uses: true   # shared with deep_sleep wakeup_pin
      number: ${PIN_KEY_POWER}
      mode: { input: true, pullup: true }
    name: "Power Off"
    internal: true
    filters: [ invert: ]
    on_press:
      then:
        # A Light Sleep build's blanked screen is only "off", not asleep —
        # this press should wake it, same as every other button, instead of
        # re-blanking a screen that's already blank. Deep Sleep builds never
        # see is_light_sleeping true, so this is always the else branch there.
        # No conn_status here, unlike every other key: Power Off still works
        # on the NO HUB / NO WIFI / HA UNREACHABLE screen.
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - script.execute: turn_off

  # ── ← left ────────────────────────────────────────────────────────────────
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_MODE}
      mode: { input: true, pullup: true }
    name: "Button Left"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
            then:
              - script.execute: btn_left

  # ── → right ───────────────────────────────────────────────────────────────
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_FAN}
      mode: { input: true, pullup: true }
    name: "Button Right"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
            then:
              - script.execute: btn_right

  # ── ● toggle / run / confirm ──────────────────────────────────────────────
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_UP_1}
      mode: { input: true, pullup: true }
    name: "Button OK"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
            then:
              - script.execute: btn_ok

  # ── ↑ up ──────────────────────────────────────────────────────────────────
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_UP_2}
      mode: { input: true, pullup: true }
    name: "Button Up"
    internal: true
    filters: [ invert: ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
            then:
              - script.execute: btn_up

  # ── ↓ down ────────────────────────────────────────────────────────────────
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_DOWN_2}
      mode: { input: true, pullup: true }
    name: "Button Down"
    internal: true
    filters: [ invert: ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
            then:
              - script.execute: btn_down

  # ── ■ off / stop / menu ───────────────────────────────────────────────────
  # Short press  → btn_stop  (AC / light OFF, stop cover, cancel menu)
  # Long  press  → btn_menu_open  (open controller selection carousel)
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_DOWN_1}
      mode: { input: true, pullup: true }
    name: "Button Stop"
    internal: true
    filters: [ invert: ]
    on_click:
      - min_length: 50ms
        max_length: 700ms
        then:
          - if:
              condition:
                lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
              then:
                - script.execute: btn_stop
      - min_length: 800ms
        max_length: 3000ms
        then:
          - if:
              condition:
                lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
              then:
                - script.execute: btn_menu_open

  # ── ☰ menu (pin 5) — open menu / confirm selection ───────────────────────
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_ECO}
      mode: { input: true, pullup: true }
    name: "Button Menu"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_multi_click:
      # long press (0.8 s) → open / close the room picker (src/room_filter.h)
      - timing:
          - ON for at least 800ms
        then:
          - if:
              condition:
                lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
              then:
                - if:
                    condition: { lambda: 'return id(app_mode) == APP_ROOMS;' }
                    then: [ script.execute: room_picker_cancel ]
                    else: [ script.execute: room_picker_open ]
      # short press → menu as before; acts as ● while the room picker is open
      - timing:
          - ON for at most 700ms
          - OFF for at least 10ms
        then:
          - if:
              condition:
                lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
              then:
                - if:
                    condition: { lambda: 'return id(app_mode) == APP_ROOMS;' }
                    then: [ script.execute: room_picker_select ]
                    else:
                      - if:
                          condition: { lambda: 'return !id(menu_active);' }
                          then: [ script.execute: menu_open ]
                          else:
                            - if:
                                # quick-action view: the middle key has no job there (RUN / BACK
                                # are the round keys), so only the carousel confirms
                                condition: { lambda: 'return id(menu_quick_index) < 0;' }
                                then: [ script.execute: menu_confirm ]

  # ── MODE / << (pin 22) — menu prev | AC: HVAC mode | Lights: circle L ─────
  # Covers: open | Autos: L slot
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_SELECT}
      mode: { input: true, pullup: true }
    name: "Button Mode"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
            then:
              - if:
                  condition: { lambda: 'return id(menu_active) && id(menu_quick_index) < 0;' }
                  then: [ script.execute: menu_prev ]
              - if:
                  condition: { lambda: 'return id(menu_active) && id(menu_quick_index) >= 0;' }
                  then: [ script.execute: menu_quick_trigger ]   # RUN
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_ROOMS;' }
                  then: [ script.execute: room_picker_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC && RoomFilter::any(AC_LIST_COUNT, acRoom);' }
                  then: [ script.execute: ac_btn_mode ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS && RoomFilter::any(LIGHTS_LIST_COUNT, lightRoom);' }
                  then: [ script.execute: lights_btn_circle_l ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS && RoomFilter::any(COVER_LIST_COUNT, coverRoom);' }
                  then: [ script.execute: covers_btn_open ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_menu_l ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_SETTINGS;' }
                  then: [ script.execute: settings_btn_up ]

  # ── FAN / >> (pin 33) — menu next | AC: fan speed | Covers: close ─────────
  # Autos: R slot
  - platform: gpio
    pin:
      allow_other_uses: ${KEYS_SHARED_WITH_WAKE}   # true where the key is also an EXT1 wake pin (PCB v4.1+)
      number: ${PIN_KEY_AC_POWER}
      mode: { input: true, pullup: true }
    name: "Button Fan"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui), id(conn_status));'
            then:
              - if:
                  condition: { lambda: 'return id(menu_active) && id(menu_quick_index) < 0;' }
                  then: [ script.execute: menu_next ]
              - if:
                  condition: { lambda: 'return id(menu_active) && id(menu_quick_index) >= 0;' }
                  then: [ script.execute: menu_back_to_carousel ]   # BACK (none when actions-only)
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_ROOMS;' }
                  then: [ script.execute: room_picker_down ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC && RoomFilter::any(AC_LIST_COUNT, acRoom);' }
                  then: [ script.execute: ac_btn_fan ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS && RoomFilter::any(LIGHTS_LIST_COUNT, lightRoom);' }
                  then: [ script.execute: lights_btn_circle_r ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS && RoomFilter::any(COVER_LIST_COUNT, coverRoom);' }
                  then: [ script.execute: covers_btn_close ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_menu_r ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_SETTINGS;' }
                  then: [ script.execute: settings_btn_down ]
