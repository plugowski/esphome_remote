# ── layout_v1.yaml ────────────────────────────────────────────────────────────
# Physical button layout for v1 hardware — original board.
#
# Pin assignment:
#    0  power off  (shared with deep-sleep wake pin)
#
# Circle pad - menu/navigation, mostly unchanged mode-to-mode:
#    5  MENU        menu: open / confirm            (also wakes a blanked screen)
#   14  SELECT      AC: cycle entity | Lights: next | Covers: next | Autos: next
#   26  TOGGLE      AC: power on/off | Lights: toggle | Covers: open<->close | Autos: trigger
#   22  MODE / <<   menu: prev | AC: cycle HVAC mode | Lights: prev | Covers: close
#                   Autos: L slot | Settings: prev row
#   33  FAN  / >>   menu: next | AC: cycle fan speed | Lights: next | Covers: open
#                   Autos: R slot | Settings: next row
#
# +/- pair - adjusts whatever value the active mode exposes; each wired to
# two GPIOs (this board's physical + and - buttons land on different pins):
#   23,17  +  menu (quick action selected): scroll up | AC: temp+
#             Lights: brightness+ | Covers: pos+ | Autos: prev in list
#             Settings: increase selected value
#   19,18  -  menu (quick action selected): scroll down | AC: temp-
#             Lights: brightness- | Covers: pos- | Autos: next in list
#             Settings: decrease selected value
#
# This layout is SELF-CONTAINED — it dispatches directly to mode scripts.
# It does NOT depend on packages/buttons.yaml (button semantics differ from v2).

binary_sensor:

  # ── power off ──────────────────────────────────────────────────────────────
  - platform: gpio
    pin:
      allow_other_uses: true   # shared with deep_sleep wakeup_pin
      number: 0
      mode: { input: true, pullup: true }
    name: "Power Off"
    internal: true
    filters: [ invert: ]
    on_press:
      then:
        # A Light Sleep build's blanked screen is only "off", not asleep —
        # this press should wake it, same as every other button, instead of
        # re-blanking a screen that's already blank. Deep Sleep builds never
        # see is_light_sleeping true, so this is always the else branch there.
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - script.execute: turn_off

  # ── SELECT — AC: cycle entity | Lights: next | Covers: next | Autos: next ──
  - platform: gpio
    pin:
      number: 14
      mode: { input: true, pullup: true }
    name: "Button Select"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC;' }
                  then: [ script.execute: ac_btn_right ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS;' }
                  then: [ script.execute: lights_btn_next ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS;' }
                  then: [ script.execute: covers_btn_right ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_next ]

  # ── TOGGLE — AC: on/off | Lights: toggle | Covers: open↔close | Autos: trigger
  - platform: gpio
    pin:
      number: 26
      mode: { input: true, pullup: true }
    name: "Button Toggle"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              # MENU (pin 5) already handles carousel confirm/back - this
              # only fills the one gap it doesn't: triggering a selected
              # quick action, same as v2's OK button.
              - if:
                  condition: { lambda: 'return id(menu_active) && id(menu_quick_index) >= 0;' }
                  then: [ script.execute: menu_quick_trigger ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC;' }
                  then: [ script.execute: ac_btn_power_toggle ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS;' }
                  then: [ script.execute: lights_btn_toggle ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS;' }
                  then: [ script.execute: covers_btn_ok ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_trigger ]

  # ── ☰ menu — open menu / confirm selection ────────────────────────────────
  - platform: gpio
    pin:
      number: 5
      mode: { input: true, pullup: true }
    name: "Button Menu"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - if:
                  condition: { lambda: 'return !id(menu_active);' }
                  then: [ script.execute: menu_open ]
                  else:
                    - if:
                        # Quick-action view showing: just drop back to the
                        # carousel (same screen the menu was opened on)
                        # instead of confirming whatever mode the carousel
                        # happens to be scrolled to - v1 has no separate
                        # back button here like v2's OK, so this one button
                        # has to tell the two states apart itself.
                        condition: { lambda: 'return id(menu_quick_index) >= 0;' }
                        then: [ script.execute: menu_back_to_carousel ]
                        else: [ script.execute: menu_confirm ]

  # ── FAN / >> — menu next / AC fan / Covers open / Autos R ────────────────
  - platform: gpio
    pin:
      number: 33
      mode: { input: true, pullup: true }
    name: "Button Fan"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - if:
                  condition: { lambda: 'return id(menu_active);' }
                  then: [ script.execute: menu_next ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC;' }
                  then: [ script.execute: ac_btn_fan ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS;' }
                  then: [ script.execute: lights_btn_next ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS;' }
                  then: [ script.execute: covers_btn_open ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_menu_r ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_SETTINGS;' }
                  then: [ script.execute: settings_btn_down ]

  # ── MODE / << — menu prev / AC HVAC mode / Lights prev / Covers close / Autos L
  - platform: gpio
    pin:
      number: 22
      mode: { input: true, pullup: true }
    name: "Button Mode"
    internal: true
    filters: [ invert:, delayed_on: 30ms ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - if:
                  condition: { lambda: 'return id(menu_active);' }
                  then: [ script.execute: menu_prev ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC;' }
                  then: [ script.execute: ac_btn_mode ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS;' }
                  then: [ script.execute: lights_btn_prev ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS;' }
                  then: [ script.execute: covers_btn_close ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_menu_l ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_SETTINGS;' }
                  then: [ script.execute: settings_btn_up ]

  # ── TEMP ↑ primary (23) ───────────────────────────────────────────────────
  - platform: gpio
    pin:
      number: 23
      mode: { input: true, pullup: true }
    name: "Button Temp Up"
    internal: true
    filters: [ invert: ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - if:
                  condition: { lambda: 'return id(menu_active) && QUICK_ACTION_COUNT > 0;' }
                  then: [ script.execute: menu_quick_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC;' }
                  then: [ script.execute: ac_btn_temp_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS;' }
                  then: [ script.execute: lights_btn_brightness_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS;' }
                  then: [ script.execute: covers_btn_pos_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_prev ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_SETTINGS;' }
                  then: [ script.execute: settings_btn_right ]

  # ── TEMP ↑ secondary (17) — same actions as pin 23 ───────────────────────
  - platform: gpio
    pin:
      number: 17
      mode: { input: true, pullup: true }
    name: "Button Temp Up 2"
    internal: true
    filters: [ invert: ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - if:
                  condition: { lambda: 'return id(menu_active) && QUICK_ACTION_COUNT > 0;' }
                  then: [ script.execute: menu_quick_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AC;' }
                  then: [ script.execute: ac_btn_temp_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_LIGHTS;' }
                  then: [ script.execute: lights_btn_brightness_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_COVERS;' }
                  then: [ script.execute: covers_btn_pos_up ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_AUTOMATIONS;' }
                  then: [ script.execute: automations_btn_prev ]
              - if:
                  condition: { lambda: 'return !id(menu_active) && id(app_mode) == APP_SETTINGS;' }
                  then: [ script.execute: settings_btn_right ]

  # ── TEMP ↓ primary (19) ───────────────────────────────────────────────────
  - platform: gpio
    pin:
      number: 19
      mode: { input: true, pullup: true }
    name: "Button Temp Down"
    internal: true
