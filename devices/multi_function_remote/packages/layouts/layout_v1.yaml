                  then: [ script.execute: settings_btn_left ]

  # ── TEMP ↓ secondary (18) — same actions as pin 19 ───────────────────────
  - platform: gpio
    pin:
      number: 18
      mode: { input: true, pullup: true }
    name: "Button Temp Down 2"
    internal: true
    filters: [ invert: ]
    on_press:
      then:
        - if:
            condition:
              lambda: 'return !RemoteCore::onUserActivity(id(oled_display), id(last_active), id(is_light_sleeping), id(updated_ui));'
            then:
              - if:
