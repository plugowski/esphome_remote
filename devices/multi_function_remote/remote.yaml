substitutions:
  # Which PCB this firmware is for; picks packages/boards/pcb_<PCB>.yaml
  # (chip, key pins, OLED power, battery source):
  #   "v3"    LOLIN32 (ESP32) carrier board, battery on an ADC divider
  #   "v4"    PCB v4.0: ESP32-C3 module, MAX17048 fuel gauge, LDO
  #   "v4_1"  ESP32-S3 module (v4.1 and later), MAX17048, buck, USB sense
  # Also settable at build time: esphome -s PCB v4 compile remote.yaml
  PCB: "v3"
  DEVICE_NAME: "oled-remote"
  FRIENDLY_NAME: "OLED Remote"
  # Lights mode view: "true" (default) shows one light per screen (card view:
  # big bulb, ON/OFF, brightness bar, LOW/FULL presets on the outer circles);
  # "false" keeps the original scrollable list. Button mapping for both is
  # documented at the top of src/lights_controller.h.
  LIGHTS_CARD_VIEW: "true"
  # Automations screen: "true" (default) one automation per screen (card:
  # icon and name), "false" the 4-row list.
  AUTOMATIONS_CARD_VIEW: "true"
  # "LIGHT" (default) lets the radio modem sleep between DTIM beacons while
  # awake — lower average current, at the cost of a little response jitter.
  # "NONE" keeps the radio fully powered for the whole awake window — more
  # responsive in-session, meaningfully more current draw while awake.
  WIFI_POWER_SAVE_MODE: "LIGHT"
  # Idle-before-blanking-the-display timeout (minutes), adjustable later on
  # the physical Settings screen. Applies the same way in both sleep
  # strategies below — it's just "how long until the screen turns off",
  # not the deep-sleep decision itself.
  SLEEP_TIMEOUT_MIN: "2"
  # false (default, "Deep Sleep"): the idle timeout goes straight to
  # deep_sleep.enter — ~10uA, months of standby, but every wake reboots
  # (WiFi reassociates, API reconnects) before the first press lands.
  # true ("Light Sleep"): the idle timeout only blanks the display and
  # keeps running (full CPU clock — no automatic light sleep of its own;
  # that was tried via CONFIG_PM_ENABLE and reverted, see esp32.framework
  # below) — WiFi/API stay associated, so a press is instant with no
  # reconnect at all. DEEP_SLEEP_FALLBACK_MIN below is the safety net
  # against leaving it powered like this indefinitely if it's put away
  # unused.
  USE_LIGHT_SLEEP: "false"
  # Only consulted when USE_LIGHT_SLEEP is true. Both are adjustable later on
  # the physical Settings screen (they're just defaults here):
  #   DEEP_SLEEP_FALLBACK_MIN - total minutes of inactivity (same last-press
  #     clock SLEEP_TIMEOUT_MIN uses, so this must be larger) before falling
  #     back to a real deep sleep anyway, outside quiet hours. 0 disables
  #     this fallback entirely - stays in Light Sleep indefinitely unless
  #     quiet hours also apply.
  #   QUIET_HOURS_START / QUIET_HOURS_END - 0-23 hour range (wraps past
  #     midnight when start > end) during which an idle device deep-sleeps
  #     right after the normal SLEEP_TIMEOUT_MIN blank instead of waiting for
  #     the long fallback - e.g. 19/6 for "asleep by 7pm, up by 6am unless
  #     it's actually being used". Equal values (the "0"/"0" default) disable
  #     the schedule entirely. A press at any time still wakes it instantly
  #     regardless of quiet hours - this only affects the *idle* decision.
  DEEP_SLEEP_FALLBACK_MIN: "60"
  # Set by the generator when its own "enable deep sleep between" fields are
  # used: QUIET_HOURS_START/END get the chosen hours and this flips to
  # "false", hiding the QUIET FROM/TO rows on the physical Settings screen —
  # a schedule fixed at build time isn't meant to be end-user-adjustable.
  # Left "true" (the default here), quiet hours stay off (0/0, disabled)
  # until whoever has the remote sets them from the Settings screen itself.
  QUIET_HOURS_ON_DEVICE: "true"
  QUIET_HOURS_START: "0"
  QUIET_HOURS_END: "0"
  # Whether the Settings screen lists the BATTERY CHECK row at all — the
  # underlying battery sensor and its wake cadence keep running either way (that
  # cadence is also the general timer-wake interval, not purely a battery
  # concept, so it isn't removable without its own separate setting), this
  # only controls whether the row is worth exposing.
  BATTERY_ENABLED: "true"
  # Default for BATTERY CHECK (battery_interval_mins), adjustable later on
  # the physical Settings screen — this is just where it starts out.
  BATTERY_INTERVAL_MIN: "60"
  # Settings > HISTORY: the battery level over the last 24 h / 7 d / 30 d,
  # read back from Home Assistant's Recorder through its REST API. The
  # entity is this device's own "Battery" sensor as HA names it (device name
  # + sensor name); ha_url / ha_token live in secrets.yaml (a long-lived
  # access token from your HA profile → Security).
  BATTERY_HISTORY_ENTITY: "sensor.${DEVICE_NAME}_battery"
  HA_URL: !secret ha_url
  HA_TOKEN: !secret ha_token
  # 0 (default): disables the UART logger entirely - saves power and boot
  # time. A real baud rate (e.g. 115200) is only needed for on-device
  # debugging or tools/screenshot.py's serial capture. Remote logging over
  # the Home Assistant API (and the HA-exposed Screenshot button) works
  # either way - this only controls the raw USB-serial output.
  LOGGER_BAUD_RATE: "0"
  # "true": stream the screen over USB for the live preview on the firmware page (https://tech.lugowski.dev/firmware/).
  # Works with the logger off. Without it a remote that finds no OLED streams anyway (see components/oled_failover).
  SCREEN_PREVIEW: "false"

packages:
  pcb:         !include packages/boards/pcb_${PCB}.yaml
  menu:        !include packages/menu.yaml
  ac:          !include packages/mode_ac.yaml
  lights:      !include packages/mode_lights.yaml
  covers:      !include packages/mode_covers.yaml
  automations: !include packages/mode_automations.yaml
  settings:    !include packages/mode_settings.yaml
  buttons:     !include packages/buttons.yaml
  layout:      !include packages/layouts/layout_v2.yaml
  screenshot:  !include packages/screenshot.yaml

# ── fonts shared across all modes ────────────────────────────────────────────
font:
  - file: "fonts/arial_bold.ttf"
    id: font_base
    size: 14
    glyphs: "0123456789.%ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz _:-/'&+(),!?#@"

  - file: "fonts/arial_bold.ttf"
    id: font_small
    size: 10
    glyphs:
      - "0123456789.%ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz _:-/'&+(),!?#@<>"
      - "\u25b2"  # ▲ (list up)
      - "\u25bc"  # ▼ (list down)

  - file: "fonts/arial_bold.ttf"
    id: font_bigger
    size: 28
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.%"

  - file: "fonts/arial_bold.ttf"
    id: font_big
    size: 40
    glyphs: "ADEGHILMOTUWRY0123456789.%"

# ── core esphome config ───────────────────────────────────────────────────────
esphome:
  name: ${DEVICE_NAME}
  friendly_name: ${FRIENDLY_NAME}
  # Floor set by the config features used here:
  #   homeassistant.action / action:  -> 2024.8
  #   ota: as a list with platform:   -> 2024.6
  # 2024.11 is the tested baseline; raise, never lower.
  #   adc attenuation: 12db                -> 2025.12 (11db is deprecated)
  min_version: 2025.12.0
  name_add_mac_suffix: false
  includes:
    - src/menu_entities.h
    - src/quick_action_entities.h
    - src/quick_action_state.h
    - src/remote_core.h
    - src/wake_utils.h
    - src/toast.h
    - src/display_utils.h
    - src/context_strip.h
    - src/room_entities.h
    - src/room_filter.h
    - src/menu_controller.h
    - src/ac_entities.h
    - src/ac_controller.h
    - src/light_entities.h
    - src/lights_controller.h
    - src/cover_entities.h
    - src/cover_controller.h
    - src/automation_entities.h
    - src/automation_controller.h
    - src/system_stats.h
    - src/about_face.h
    - src/about_screen.h
    - src/espnow_protocol.h
    - src/history_core.h
    - src/battery_history.h
    - src/settings_controller.h
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            id(is_timer_wake) = is_timer_wakeup();
            // A battery-only timer wake parks setup at the boot gate (-250):
            // the battery job below (-200) reports and puts the remote back to
            // sleep from there, so the display (-300) is never set up - no
            // init sequence, no DISPLAY ON, nothing on the I2C bus for it.
            // (On PCB v3 the OLED keeps 3V3 and only its ground is switched,
            // so that traffic used to give it a ground path and light it.)
            if (id(is_timer_wake)) id(battery_wake_gate).hold();
        # A board whose fuel gauge shares the OLED bus (PCB v4.0) needs the
        # OLED supply on a timer wake too, for the bus pull-ups; the panel
        # stays dark since the display never initialises.
        - if:
            condition: { lambda: 'return !id(is_timer_wake) || ${OLED_POWER_ON_TIMER_WAKE};' }
            then:
              - output.turn_on: oled_power
              # blocking, so the rail is up before the I2C devices set up
              - lambda: 'delay(10);'
    - priority: 250
      then:
        - if:
            condition: { lambda: 'return !id(is_timer_wake);' }
            then:
              - lambda: |-
                  if (id(app_mode) == APP_ROOMS) id(app_mode) = id(room_picker_return);
                  id(app_mode) = MenuController::validMode(id(app_mode));
                  // actions-only build: the quick-action list is the home screen
                  MenuController::pinActions(id(menu_active), id(menu_quick_index));
                  menu_key_shown() = MenuController::menuKeyLive();
                  RoomFilter::current() = id(room_filter);
                  Toast::setFonts(id(font_base), id(font_small));
                  RemoteCore::resetIdleTimer(id(last_active));
                  id(is_booting) = true;
                  // The display's own `contrast:` config below is a fixed
                  // value applied at setup - it doesn't know about the
                  // restore_value'd contrast_level global, so every boot
                  // otherwise reset the screen to that fixed default
                  // instead of whatever the user last set on the physical
                  // Settings screen.
                  id(oled_display)->set_contrast(SettingsController::contrastFloat(id(contrast_level)));
    # Battery-only timer wake: runs while setup waits at the boot gate (WiFi
    # and the API keep running there). Read the battery, publish it, sleep.
    - priority: -200
      then:
        - if:
            condition: { lambda: 'return id(is_timer_wake);' }
            then:
              - if:
                  condition: { lambda: 'return consume_recent_normal_wake();' }
                  then:
                    # A button wake already delivered a fresher battery
                    # reading to HA more recently than this scheduled check
                    # would — skip the WiFi/API round trip and go straight
                    # back to sleep.
                    - deep_sleep.enter:
                        sleep_duration: !lambda 'return (uint32_t)id(battery_interval_mins) * 60000;'
                  else:
                    # Timer wake: read battery, wait for the API to publish, sleep again
                    - component.update: battery_source
                    - wait_until:
                        condition:
                          api.connected:
                        timeout: 8s
                    - delay: 300ms   # ensure the value is flushed to HA
                    - deep_sleep.enter:
                        sleep_duration: !lambda 'return (uint32_t)id(battery_interval_mins) * 60000;'
    # Normal wake: after the display (-300) is set up.
    - priority: -400
      then:
        - if:
            condition: { lambda: 'return !id(is_timer_wake);' }
            then:
              # Draw the real UI immediately from cached state
              # instead of blocking the screen (and buttons — they already
              # work regardless, see each mode's *_btn_* scripts) on the
              # network. conn_status drives a small corner badge instead of
              # a full-screen gate; boot_connect_watchdog updates it
              # asynchronously without holding up anything else here.
              # Read the battery now so the low-battery notice below has a value.
              - component.update: battery_source
              - lambda: |-
                  mark_normal_wake();
                  id(is_booting) = false;
                  id(updated_ui) = true;
                  // Low-battery notice from the reading just taken (battery_source
                  // sets battery_pct; -1 = no reading).
                  const int battery_now = id(battery_pct);
                  if (battery_now >= 0 && battery_now < 10) {
                    char msg[16];
                    snprintf(msg, sizeof(msg), "BATTERY %d%%", battery_now);
                    Toast::show(msg, "CHARGE SOON", 10000, Toast::ICON_BATTERY);  // any key closes it sooner
                  }
              - script.execute: main_update
              - script.execute: boot_connect_watchdog

# board / flash size come from the PCB package
esp32:
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BOOTLOADER_SKIP_VALIDATE_IN_DEEP_SLEEP: "y"
      CONFIG_BOOTLOADER_LOG_LEVEL_NONE: "y"
      # Settings > SYSTEM reads each core's idle time for its CPU bar
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"
      # CONFIG_PM_ENABLE (automatic FreeRTOS-tickless-idle light sleep) was
      # tried here and reverted: on real hardware it destabilized WiFi/API
      # (dropped connections, "took a long time" component warnings from the
      # resulting frequency scaling) and crashed (StoreProhibited) when
      # combined with deep_sleep.enter. The actual Light Sleep *strategy*
      # (USE_LIGHT_SLEEP — display off, WiFi/API stay associated) does not
      # depend on this and is unaffected by removing it.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10dB
  fast_connect: true
  power_save_mode: ${WIFI_POWER_SAVE_MODE}
  # A static-IP generator build inserts a `manual_ip:` block here (values from
  # secrets.yaml) plus `mdns: disabled: true` below — DHCP/mDNS discovery is
  # the safe default when no static IP is configured.
  on_connect:
    - if:
        condition: { lambda: 'return id(conn_status) == 1;' }
        then:
          - lambda: 'id(conn_status) = 0; id(updated_ui) = true;'
  on_disconnect:
    - lambda: 'id(conn_status) = 1; id(updated_ui) = true;'

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
  on_client_connected:
    - lambda: 'id(conn_status) = 0; id(updated_ui) = true;'
  on_client_disconnected:
    - if:
        condition:
          wifi.connected:
        then:
          - lambda: 'id(conn_status) = 2; id(updated_ui) = true;'

ota:
  - platform: esphome

logger:
  baud_rate: ${LOGGER_BAUD_RATE}

# oled_power (output), the I2C bus(es) and battery_source come from the PCB
# package.
deep_sleep:
  id: go_sleep
  wakeup_pin:
    number: ${PIN_KEY_POWER}
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP

# Only used to know the hour-of-day for quiet hours (a Light Sleep build's
# scheduled deep-sleep window). No explicit timezone: — ESPHome auto-detects
# it from the machine that compiles this; override with `timezone: "..."` here
# if that's wrong (e.g. a UTC build container) for your actual location.
time:
  - platform: sntp
    id: sntp_time

# Battery-only timer wakes stop at this gate (held in on_boot 700) and sleep
# from there; see components/boot_gate.
external_components:
  - source:
      type: local
      path: components
    components: [ boot_gate, oled_failover ]

boot_gate:
  id: battery_wake_gate
  setup_priority: -250

display:
  # Falls back to a virtual screen when no OLED answers on I2C, so the remote still runs headless; with
  # SCREEN_PREVIEW it also streams every frame to the log for the website's live preview.
  - platform: oled_failover
    i2c_id: oled_bus
    mirror: ${SCREEN_PREVIEW}
    # After the boot gate, so a battery-only timer wake never sets it up.
    setup_priority: -300
    model: "SH1106 128x64"
    address: 0x3C
    rotation: 180
    contrast: 0.5
    id: oled_display

# ── shared globals ────────────────────────────────────────────────────────────
globals:
  - id: app_mode          # 0 = AC  |  1 = Lights  |  2 = Covers  |  3 = Automations
    type: int
    initial_value: '0'
    # restore_value (flash/NVS) rather than RTC memory: mode only changes on
    # an explicit menu confirm, not every button press, so the flash-wear
    # cost is low - and unlike RTC memory this survives an OTA reboot or a
    # real power cycle, so the remote reopens where it was left instead of
    # jumping back to AC/mode 0 the moment it's reflashed or loses power.
    restore_value: true

  - id: menu_active
    type: bool
    initial_value: 'false'

  - id: menu_index
    type: int
    initial_value: '0'

  - id: debounce_active
    type: bool
    initial_value: 'false'

  - id: last_active
    type: int
    restore_value: no
    initial_value: '0'

  - id: updated_ui
    type: bool
    initial_value: 'true'

  - id: is_booting     # cleared in on_boot itself, before the main loop ever
    type: bool         # runs — draw() calls gate on it mainly as a defensive
    initial_value: 'true'  # guard against a button racing the very first frame.

  - id: is_shutting_down
    type: bool
    initial_value: 'false'

  - id: is_light_sleeping  # display blanked by the idle timeout in a Light
    type: bool             # Sleep build; the device is otherwise still
    initial_value: 'false' # fully running (WiFi/API stay associated).
    # deep_sleep_fallback_mins / quiet_hours_start / quiet_hours_end live in
    # packages/mode_settings.yaml, alongside the rest of the Settings-screen-
    # adjustable globals.

  - id: is_timer_wake      # true when woken by RTC timer (battery check only)
    type: bool
    initial_value: 'false'

  - id: conn_status         # 0=ok  1=no-wifi  2=no-ha  3=entities-missing
    type: int
    initial_value: '0'


# ── core scripts ──────────────────────────────────────────────────────────────
script:

  # Both the idle timeout AND the physical Power Off button land here — a
  # Light Sleep build never deep-sleeps on demand, only via
  # deep_sleep_fallback below (long idle, or quiet hours).
  - id: turn_off
    mode: single
    then:
      - if:
          condition: { lambda: 'return ${USE_LIGHT_SLEEP};' }
          then:
            - lambda: |-
                id(is_light_sleeping) = true;
                id(oled_display)->turn_off();
          else:
            # halt: from here on no refresh loop (Settings SYSTEM / ABOUT tick,
            # state updates, the display's own poll) can draw or send a frame,
            # and every key press is swallowed until deep sleep.
            - lambda: |-
                id(is_shutting_down) = true;
                RemoteCore::halt(id(oled_display));
                RemoteCore::drawPowerOff(id(oled_display), id(font_base));
            - delay: 1s
            - lambda: |-
                id(oled_display)->clear();
                id(oled_display)->display();
            - delay: 500ms
            - output.turn_off: oled_power
            - delay: 5ms
            - deep_sleep.enter:
                sleep_duration: !lambda 'return (uint32_t)id(battery_interval_mins) * 60000;'

  # Reached only from a Light Sleep build's blanked (is_light_sleeping) idle
  # state: either DEEP_SLEEP_FALLBACK_MIN of total inactivity passed (put
  # away and forgotten), or it's currently within quiet hours (see the
  # interval below) — no power-off animation, nobody's watching by then.
  - id: deep_sleep_fallback
    mode: single
    then:
      - lambda: 'id(is_shutting_down) = true; RemoteCore::halt(id(oled_display));'
      - output.turn_off: oled_power
      - delay: 5ms
      - deep_sleep.enter:
          sleep_duration: !lambda 'return (uint32_t)id(battery_interval_mins) * 60000;'

  - id: boot_screen
    then:
      - lambda: 'RemoteCore::drawBoot(id(oled_display), id(menu_icon_big), id(font_small));'

  # Runs alongside the real UI on a normal wake — does not block anything.
  # Flags a genuine connect failure (conn_status = 1) after a generous
  # timeout, driving the corner badge; the on_client_connected/disconnected
  # handlers above cover the HA-unreachable case (conn_status = 2) instead.
  - id: boot_connect_watchdog
    then:
      - wait_until:
          condition:
            wifi.connected:
          timeout: 10s
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - lambda: 'id(conn_status) = 1; id(updated_ui) = true;'

  # dispatches to the active mode's update/draw on every interval tick
  - id: main_update
    then:
      # Toast ran out or was dismissed: redraw the screen underneath
      - lambda: 'if (Toast::expired()) id(updated_ui) = true;'
      - if:
          condition: { lambda: 'return !id(is_shutting_down);' }
          then:
            - if:
                condition: { lambda: 'return id(is_booting);' }
                then: [ script.execute: boot_screen ]
                else:
                  - if:
                      condition: { lambda: 'return id(conn_status) != 0;' }
                      then:
                        - lambda: 'RemoteCore::drawConnError(id(oled_display), id(font_base), id(font_small), id(conn_status));'
                      else:
                        - if:
                            condition: { lambda: 'return id(menu_active);' }
                            then: [ script.execute: menu_draw ]
                            else:
                              - if:
                                  condition: { lambda: 'return id(app_mode) == APP_AC;' }
                                  then: [ script.execute: ac_update ]
                              - if:
                                  condition: { lambda: 'return id(app_mode) == APP_LIGHTS;' }
                                  then: [ script.execute: lights_update ]
                              - if:
                                  condition: { lambda: 'return id(app_mode) == APP_COVERS;' }
                                  then: [ script.execute: covers_update ]
                              - if:
                                  condition: { lambda: 'return id(app_mode) == APP_AUTOMATIONS;' }
                                  then: [ script.execute: automations_update ]
                              - if:
                                  condition: { lambda: 'return id(app_mode) == APP_SETTINGS;' }
                                  then: [ script.execute: settings_update ]
                              - if:
                                  condition: { lambda: 'return id(app_mode) == APP_ROOMS;' }
                                  then: [ script.execute: room_picker_draw ]

# ── main loop ─────────────────────────────────────────────────────────────────
interval:
  - interval: 500ms
    then:
      - if:
          condition: { lambda: 'return !id(is_timer_wake);' }
          then:
            - if:
                condition: { lambda: 'return id(is_light_sleeping);' }
                then:
                  # Already blanked (Light Sleep) — main_update has nothing
                  # to draw to a display that's off, so the only thing left
                  # to check here is: are we within quiet hours (deep-sleep
                  # right away instead of waiting for the long fallback), or
                  # has the long fallback itself elapsed? deep_sleep_fallback_mins
                  # == 0 disables that fallback entirely (quiet hours, if set,
                  # still applies) — stays in Light Sleep indefinitely otherwise.
                  - if:
                      condition:
                        lambda: |-
                          auto t = id(sntp_time)->now();
                          bool quiet = t.is_valid() && RemoteCore::inQuietHours(
                            t.hour, id(quiet_hours_start), id(quiet_hours_end));
                          bool fallback_due = id(deep_sleep_fallback_mins) > 0 && RemoteCore::isIdle(
                            id(last_active), id(deep_sleep_fallback_mins) * 60);
                          return quiet || fallback_due;
                      then: [ script.execute: deep_sleep_fallback ]
                else:
                  - if:
                      condition:
                        lambda: 'return RemoteCore::isIdle(id(last_active), id(sleep_timeout_mins) * 60);'
                      then: [ script.execute: turn_off ]
                      else: [ script.execute: main_update ]
